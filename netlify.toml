[build]
  command  = "npm run build"
  publish  = "dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag   = "noindex, nofollow, noarchive"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
